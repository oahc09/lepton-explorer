[package]
name = "lepton-explorer"
version = "1.1.7"
description = "Lepton Explorer - Windows 11 style file manager"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lepton_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "5"
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Kernel", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_NetworkManagement_WNet", "Win32_System_Memory", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices"] }
trash = "5"
notify = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
base64 = "0.22"
lru = "0.12"
once_cell = "1"
zip = "2"
sevenz-rust2 = "0.20"
unrar-rs = { version = "0.4", default-features = false, features = ["crypto-rust"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
semver = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Smaller, faster release binary: whole-crate LTO, one codegen unit, stripped
# symbols. Build time increases slightly; runtime perf and installer size win.
lto = true
codegen-units = 1
strip = true
panic = "unwind"

